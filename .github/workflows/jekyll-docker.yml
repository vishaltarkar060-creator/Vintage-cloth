<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vintage Cloths</title>
<style>
  :root{
    --ink:#1f2a1f;
    --paper:#faf7ef;
    --leaf:#2e5339;
    --leaf-dark:#203b28;
    --clay:#c9622b;
    --clay-dark:#a84f21;
    --line:#e4ddc9;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3{font-family:Georgia, 'Times New Roman', serif; margin:0;}
  a{color:inherit;}
  img{max-width:100%;display:block;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .shop-name{font-size:1.3rem; font-weight:700; letter-spacing:.2px; color:var(--leaf-dark);}
  .cart-btn{
    position:relative; background:none; border:none; cursor:pointer;
    width:42px; height:42px; display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:var(--leaf);
  }
  .cart-btn svg{width:20px; height:20px; stroke:#fff;}
  .cart-count{
    position:absolute; top:-4px; right:-4px;
    background:var(--clay); color:#fff; font-size:.7rem; font-weight:700;
    min-width:18px; height:18px; border-radius:9px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; height:78vh; min-height:420px;
    display:flex; align-items:flex-end;
    background:#000;
    overflow:hidden;
  }
  .hero img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.72;
  }
  .hero-content{
    position:relative; z-index:2; color:#fff; padding:32px 22px 44px;
    max-width:520px;
  }
  .hero-tag{
    font-size:.75rem; letter-spacing:1px; color:#f0e6d2; opacity:.85; margin-bottom:8px;
  }
  .hero h1{font-size:2.2rem; line-height:1.15; color:#fff;}
  .hero p{margin:14px 0 22px; font-size:1.05rem; color:#f3efe2;}
  .shop-now{
    display:inline-block; background:var(--clay); color:#fff; border:none;
    padding:13px 26px; border-radius:6px; font-size:.95rem; font-weight:600;
    cursor:pointer; text-decoration:none;
  }
  .shop-now:active{background:var(--clay-dark);}

  /* ---------- Products ---------- */
  .products-section{padding:36px 0 50px;}
  .section-heading{padding:0 20px; margin-bottom:18px;}
  .section-heading h2{font-size:1.4rem; color:var(--leaf-dark);}

  .carousel{
    display:flex; gap:16px; overflow-x:auto; padding:4px 20px 12px;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
  }
  .carousel::-webkit-scrollbar{display:none;}
  .product-card{
    flex:0 0 200px; scroll-snap-align:start;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .product-card img{width:100%; height:150px; object-fit:cover;}
  .product-info{padding:12px 14px 16px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .product-info h3{font-size:.98rem; color:var(--ink);}
  .price{font-weight:700; color:var(--leaf-dark); font-size:1rem;}
  .add-btn{
    margin-top:auto; background:var(--leaf); color:#fff; border:none;
    padding:9px 0; border-radius:6px; font-size:.85rem; font-weight:600; cursor:pointer;
  }
  .add-btn:active{background:var(--leaf-dark);}

  /* ---------- Cart Drawer ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:50;
  }
  .overlay.open{opacity:1; pointer-events:auto;}

  .cart-drawer{
    position:fixed; top:0; right:0; height:100%; width:88%; max-width:380px;
    background:var(--paper); z-index:60;
    transform:translateX(100%); transition:transform .3s ease;
    display:flex; flex-direction:column;
    box-shadow:-6px 0 24px rgba(0,0,0,.15);
  }
  .cart-drawer.open{transform:translateX(0);}
  .cart-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px; border-bottom:1px solid var(--line);
  }
  .cart-header h2{font-size:1.15rem;}
  .close-btn{background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--ink); line-height:1;}

  .cart-items{flex:1; overflow-y:auto; padding:12px 18px;}
  .cart-empty{color:#8a8677; text-align:center; margin-top:40px; font-size:.9rem;}
  .cart-item{
    display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  .cart-item img{width:56px; height:56px; border-radius:6px; object-fit:cover; flex-shrink:0;}
  .cart-item-info{flex:1; display:flex; flex-direction:column; gap:4px;}
  .cart-item-info .name{font-size:.9rem; font-weight:600;}
  .qty-row{display:flex; align-items:center; gap:10px;}
  .qty-btn{
    width:24px; height:24px; border-radius:5px; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-size:.9rem; line-height:1;
  }
  .qty-val{font-size:.9rem; min-width:16px; text-align:center;}
  .remove-btn{background:none; border:none; color:var(--clay); font-size:.78rem; cursor:pointer; padding:0; align-self:flex-start;}
  .item-total{font-size:.85rem; font-weight:600; align-self:flex-start;}

  .cart-footer{border-top:1px solid var(--line); padding:16px 18px 20px;}
  .total-row{display:flex; justify-content:space-between; font-weight:700; font-size:1.05rem; margin-bottom:14px;}

  .order-form{display:flex; flex-direction:column; gap:10px;}
  .order-form input, .order-form textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px;
    font-size:.9rem; font-family:inherit; background:#fff;
  }
  .order-form textarea{resize:vertical; min-height:56px;}
  .send-btn{
    background:var(--clay); color:#fff; border:none; padding:12px 0;
    border-radius:6px; font-size:.95rem; font-weight:700; cursor:pointer; margin-top:4px;
  }
  .send-btn:disabled{opacity:.6;}
  .form-hint{font-size:.72rem; color:#8a8677; margin-top:-4px;}

  /* ---------- WhatsApp float ---------- */
  .whatsapp-float{
    position:fixed; bottom:22px; left:18px; z-index:45;
    width:52px; height:52px; border-radius:50%;
    background:#25D366; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.25); text-decoration:none;
  }
  .whatsapp-float svg{width:26px; height:26px; fill:#fff;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translate(-50%,20px);
    background:var(--leaf-dark); color:#fff; padding:11px 20px; border-radius:24px;
    font-size:.88rem; opacity:0; pointer-events:none; transition:all .25s ease; z-index:80;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  footer{text-align:center; padding:26px 20px 40px; color:#8a8677; font-size:.8rem;}
</style>
</head>
<body>

<header>
  <div class="shop-name">Vintage Cloths</div>
  <button class="cart-btn" id="cartBtn" aria-label="Open cart">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span class="cart-count" id="cartCount" style="display:none;">0</span>
  </button>
</header>

<section class="hero" id="hero">
  <img src="https://i.ibb.co/TxNSWk3P/photo-1555529669-e69e7aa0ba9a.jpg" alt="Vintage Cloths">
  <div class="hero-content">
    <div class="hero-tag">Timeless pieces, hand-picked</div>
    <h1>Vintage Cloths</h1>
    <p>Curated vintage clothing with character you won't find on the high street.</p>
    <a href="#products" class="shop-now">Shop Now</a>
  </div>
</section>

<section class="products-section" id="products">
  <div class="section-heading"><h2>Our Products</h2></div>
  <div class="carousel" id="carousel">
    <!-- product cards injected by JS -->
  </div>
</section>

<a class="whatsapp-float" href="https://wa.me/999999999" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.4 8.6 3.4 15.6c0 2.5.7 4.8 1.9 6.8L3 29l6.8-2.2c1.9 1 4 1.6 6.2 1.6 7 0 12.6-5.6 12.6-12.6C28.6 8.6 23 3 16 3zm0 22.9c-2 0-3.9-.5-5.5-1.5l-.4-.2-4 1.3 1.3-3.9-.3-.4c-1.1-1.7-1.7-3.7-1.7-5.8C5.4 9.7 10.1 5 16 5s10.6 4.7 10.6 10.6S21.9 25.9 16 25.9zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1c-.3-.2-1.4-.5-2.7-1.7-1-.9-1.6-2-1.8-2.3-.2-.3 0-.5.1-.6.1-.1.3-.4.5-.5.2-.2.2-.3.3-.5.1-.2 0-.4 0-.6s-.7-1.7-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.3 1.4 3.5c.2.2 2.3 3.6 5.7 5 .8.3 1.4.5 1.9.7.8.2 1.5.2 2 .1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.3.2-1.5-.1-.1-.3-.2-.6-.4z"/></svg>
</a>

<div class="overlay" id="overlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h2>Your Cart</h2>
    <button class="close-btn" id="closeCart" aria-label="Close cart">&times;</button>
  </div>
  <div class="cart-items" id="cartItems">
    <p class="cart-empty">Your cart is empty.</p>
  </div>
  <div class="cart-footer">
    <div class="total-row"><span>Total</span><span id="cartTotal">₹0</span></div>
    <form class="order-form" id="orderForm">
      <input type="text" id="custName" placeholder="Your name" required>
      <input type="tel" id="custPhone" placeholder="Phone number" required>
      <input type="email" id="custEmail" placeholder="Your email" required>
      <textarea id="custAddress" placeholder="Address / notes"></textarea>
      <button type="submit" class="send-btn" id="sendBtn">Send Order</button>
      <div class="form-hint">Order details are emailed straight to the shop owner.</div>
    </form>
  </div>
</aside>

<div class="toast" id="toast"></div>

<footer>&copy; <span id="year"></span> Vintage Cloths</footer>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
/* =========================================================
   HOW TO ACTIVATE ORDER EMAILS (3 steps):
   1. Sign up free at https://www.emailjs.com
   2. Connect your Gmail (vishaltarkar060@gmail.com) and create an
      email template using these variables in the template body:
      {{customer_name}}, {{customer_phone}}, {{customer_email}},
      {{customer_address}}, {{order_items}}, {{order_total}}
   3. Replace the three placeholders below with your own IDs from
      the EmailJS dashboard.
   ========================================================= */
const EMAILJS_PUBLIC_KEY  = "YOUR_PUBLIC_KEY";
const EMAILJS_SERVICE_ID  = "YOUR_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";

(function(){
  if (window.emailjs) emailjs.init(EMAILJS_PUBLIC_KEY);
})();

/* ---------------- Product data ---------------- */
const PRODUCTS = [
  { id: 1, name: "Vintage Denim Jacket", price: 899, img: "https://i.ibb.co/twschfgK/04d6ce8a0fd1dcba12c9c73880feb568.jpg" },
  { id: 2, name: "Retro Floral Dress", price: 749, img: "https://i.ibb.co/FGHYxZX/3ea39c6203039e81c173bf199703253f.jpg" },
  { id: 3, name: "Classic Corduroy Shirt", price: 599, img: "https://i.ibb.co/7NjSRHKW/ffc91c1299e3685160b412532c91e25d.jpg" },
  { id: 4, name: "Vintage Knit Sweater", price: 649, img: "https://i.ibb.co/9QPYGcM/f84e8050f61a8bd4612a6a4ddb7f70f0.jpg" }
];

let cart = []; // {id, name, price, img, qty}

/* ---------------- Render products ---------------- */
const carousel = document.getElementById('carousel');
PRODUCTS.forEach(p => {
  const card = document.createElement('div');
  card.className = 'product-card';
  card.innerHTML = `
    <img src="${p.img}" alt="${p.name}">
    <div class="product-info">
      <h3>${p.name}</h3>
      <div class="price">₹${p.price}</div>
      <button class="add-btn" data-id="${p.id}">Add to Cart</button>
    </div>`;
  carousel.appendChild(card);
});

carousel.addEventListener('click', e => {
  const btn = e.target.closest('.add-btn');
  if (!btn) return;
  const product = PRODUCTS.find(p => p.id == btn.dataset.id);
  addToCart(product);
  showToast(`${product.name} added to cart`);
});

/* ---------------- Cart logic ---------------- */
function addToCart(product){
  const existing = cart.find(i => i.id === product.id);
  if (existing) existing.qty += 1;
  else cart.push({ ...product, qty: 1 });
  renderCart();
}

function changeQty(id, delta){
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
  renderCart();
}

function removeItem(id){
  cart = cart.filter(i => i.id !== id);
  renderCart();
}

function cartTotal(){
  return cart.reduce((sum, i) => sum + i.price * i.qty, 0);
}

function renderCart(){
  const container = document.getElementById('cartItems');
  const countEl = document.getElementById('cartCount');
  const totalEl = document.getElementById('cartTotal');
  const itemCount = cart.reduce((n, i) => n + i.qty, 0);

  countEl.style.display = itemCount > 0 ? 'flex' : 'none';
  countEl.textContent = itemCount;
  totalEl.textContent = `₹${cartTotal()}`;

  if (cart.length === 0){
    container.innerHTML = '<p class="cart-empty">Your cart is empty.</p>';
    return;
  }

  container.innerHTML = cart.map(i => `
    <div class="cart-item">
      <img src="${i.img}" alt="${i.name}">
      <div class="cart-item-info">
        <div class="name">${i.name}</div>
        <div class="qty-row">
          <button class="qty-btn" data-action="dec" data-id="${i.id}">-</button>
          <span class="qty-val">${i.qty}</span>
          <button class="qty-btn" data-action="inc" data-id="${i.id}">+</button>
        </div>
        <button class="remove-btn" data-action="remove" data-id="${i.id}">Remove</button>
      </div>
      <div class="item-total">₹${i.price * i.qty}</div>
    </div>
  `).join('');
}

document.getElementById('cartItems').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = Number(btn.dataset.id);
  if (btn.dataset.action === 'inc') changeQty(id, 1);
  if (btn.dataset.action === 'dec') changeQty(id, -1);
  if (btn.dataset.action === 'remove') removeItem(id);
});

/* ---------------- Drawer open/close ---------------- */
const cartDrawer = document.getElementById('cartDrawer');
const overlay = document.getElementById('overlay');
function openCart(){ cartDrawer.classList.add('open'); overlay.classList.add('open'); }
function closeCartFn(){ cartDrawer.classList.remove('open'); overlay.classList.remove('open'); }
document.getElementById('cartBtn').addEventListener('click', openCart);
document.getElementById('closeCart').addEventListener('click', closeCartFn);
overlay.addEventListener('click', closeCartFn);

/* ---------------- Order submission ---------------- */
document.getElementById('orderForm').addEventListener('submit', function(e){
  e.preventDefault();
  if (cart.length === 0){ showToast('Your cart is empty'); return; }

  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const email = document.getElementById('custEmail').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const itemsText = cart.map(i => `${i.name} x${i.qty} - ₹${i.price * i.qty}`).join('\n');
  const total = cartTotal();

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending...';

  const templateParams = {
    customer_name: name,
    customer_phone: phone,
    customer_email: email,
    customer_address: address || 'Not provided',
    order_items: itemsText,
    order_total: `₹${total}`
  };

  if (!window.emailjs || EMAILJS_PUBLIC_KEY === "YOUR_PUBLIC_KEY"){
    // EmailJS not configured yet - show what would be sent
    console.log('Order (EmailJS not configured):', templateParams);
    showToast('Order captured (connect EmailJS to email it)');
    finishOrder();
    return;
  }

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
    .then(() => {
      showToast('Order sent! The shop will contact you soon.');
      finishOrder();
    })
    .catch(err => {
      console.error(err);
      showToast('Could not send order. Please try again.');
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send Order';
    });
});

function finishOrder(){
  cart = [];
  renderCart();
  document.getElementById('orderForm').reset();
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = false;
  sendBtn.textContent = 'Send Order';
  setTimeout(closeCartFn, 900);
}

/* ---------------- Toast ---------------- */
let toastTimer;
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
